<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms Exercise</title>
    <link rel="stylesheet" href="styles.css" type="text/css" />
  </head>
  <body>
    <div class="container">
      <div class="image">
        <div class="logo-container">
          <img src="logo.png" alt="" class="logo" />
          <div>
            <h2 class="logo-text">SPORTASK</h2>
          </div>
        </div>
        <div class="refference">
          Photo by
          <a
            href="https://unsplash.com/@kevinhernandezreyes?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Kevin Hernandez Reyes</a
          >
          on
          <a
            href="https://unsplash.com/photos/couple-embracing-at-sunset-with-trees-S1nCSK3O6e0?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Unsplash</a
          >
        </div>
      </div>

      <div class="right-side">
        <h3>This is not a real online service! You know you need something
            like this in ytour life to help you realize yopur deepest dreams,
            Sign up now to get started!
        </h3>
        <h3>
            You know you want to!
        </h3>
        <div class="form">
            <form action="#" method="post">
                <fieldset>
                    <h2>Let's do this!</h2>
                    <div class="two-columns">
                        <div>
                            <label for="first_name">First Name:</label>
                            <input type="text" id="first_name" name="first_name" placeholder="John" />
                        </div>
                        <div>
                            <label for="last_name">Last Name:</label>
                            <input type="text" id="last_name" name="last_name" placeholder="Doe" />
                        </div>
                    </div>
                    <div class="two-columns">
                        <div>
                            <label for="user_email">Email:</label>
                            <input type="email" id="user_email" name="email" placeholder="johndoe@gmail.com" />
                        </div>
                        <div>
                            <label for="phone_number">Phone Number:</label>
                            <input type="number" id="phone_number" name="phone_number" placeholder="999-9999" />
                        </div>
                    </div>
                    <div class="two-columns">
                        <div>
                            <label for="user_password">Password:</label>
                            <input type="password" id="user_password" name="password" />
                        </div>
                        <div>
                            <label for="confirm_password">Confirm Password:</label>
                            <input type="password" id="confirm_password" name="confirmPassword" />
                        </div>
                    </div>


                </fieldset>
                <button><div class="button-text">Submit</div></button>
            </form>

        </div>
      </div>
    </div>
  </body>
</html>
